services:
  mawi-postgres:
    # pgvector image (Postgres 15 + pgvector extension) — required by
    # migration 032_semantic_cache which CREATEs EXTENSION vector.
    image: pgvector/pgvector:pg15
    container_name: mawi-postgres
    restart: always
    environment:
      POSTGRES_USER: mawi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mawi_dev_password} # ⚠️ Change for production!
      POSTGRES_DB: mawi
    ports:
      - "5432:5432"
    volumes:
      - mawi_pg_data:/var/lib/postgresql/data

  # Single container — Rust gateway + embedded admin SPA on port 8030.
  # The Next.js frontend is built as a static export at image-build
  # time and served from /app/static by the gateway. /v1/* is the API,
  # / is the UI, same origin → no CORS, no separate Node container.
  mawi-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mawi-api
    restart: always
    depends_on:
      - mawi-postgres
    env_file:
      - .env
    environment:
      MG_DATABASE_URL: postgres://mawi:${POSTGRES_PASSWORD:-mawi_dev_password}@mawi-postgres:5432/mawi
      MG_RUST_LOG: ${MG_RUST_LOG:-info}
      # Same-origin UI removes the need for CORS in default deployments.
      # Set MG_CORS_ALLOWED_ORIGINS only if you're calling /v1/* from a
      # different host (e.g. a separately-hosted frontend or a CLI on
      # another machine).
      MG_CORS_ALLOWED_ORIGINS: ${MG_CORS_ALLOWED_ORIGINS:-}
      MG_PORT: 8030
      MG_ENABLE_METRICS: ${MG_ENABLE_METRICS:-true}
      MG_MASTER_KEY: ${MG_MASTER_KEY} # Required in production! Generate with: openssl rand -hex 32
      # Don't try to load /etc/mawigateway/services.yaml inside the
      # container — only set this when you mount a real config volume.
      MG_CONFIG_FILE: ""
      # OSS Mode by default (No Enterprise features)
    ports:
      # 8030 is the canonical port. 3001 stays as a back-compat
      # mapping so existing bookmarks (mawi-web on :3001) keep working.
      - "8030:8030"
      - "3001:8030"
    volumes:
      # Mount Docker socket to allow spawning MCP server containers
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mawi_pg_data:
