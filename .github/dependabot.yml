version: 2
updates:
  # Rust backend
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Major bumps usually need code migration (e.g. rand 0.8 → 0.10 removed
    # `thread_rng()`). Suppress for now; revisit by removing this `ignore`
    # block when the team has bandwidth for migrations.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps(rust)

  # Next.js frontend
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Same reasoning as cargo — eslint 8→10 cascades through eslint-config-next,
    # next 14→15 changes routing primitives, etc.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      next-and-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'eslint-config-next']
      ts-tooling:
        patterns: ['typescript', '@types/*', 'eslint*', 'postcss', 'tailwindcss', 'autoprefixer']
      js-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps(npm)

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(actions)

  # Dockerfiles (base image bumps)
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps(docker)

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps(docker)
