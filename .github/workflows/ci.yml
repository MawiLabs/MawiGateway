name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # NOTE: `-D warnings` is intentionally NOT set yet. The gateway crate has
  # a backlog of design-level lints (too_many_arguments, large_enum_variant,
  # type_complexity, dead_code) that need real refactors. Until they're
  # cleaned up, CI logs warnings but doesn't fail on them. Re-enable
  # `-D warnings` (here and on the clippy step) once the backlog is zero.

jobs:
  # ---------------------------------------------------------------------------
  # Backend: format, lint, test, build
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace --release

  # ---------------------------------------------------------------------------
  # Frontend: install, lint, typecheck, build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker smoke build: prove both images build (single-arch, no push)
  # ---------------------------------------------------------------------------
  docker-smoke:
    name: Docker smoke build (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: mawi-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: mawi-web
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: false
          load: false
          tags: ${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=${{ matrix.image.name }}-ci
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-ci
