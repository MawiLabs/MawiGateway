# MawiGateway configuration file — example.
#
# Activate by setting MG_CONFIG_FILE=/path/to/this/file in the
# gateway's environment. Contents are validated at boot and upserted
# into the providers / models / services / service_models tables.
# Re-applying the same file is a no-op (idempotent).
#
# Schema is owned by `mawi-core::config_file::GatewayConfig`. Bump
# `version` when the schema gains breaking changes.

version: 1

# Providers — the upstream APIs we call.
# Recommended: keep API keys in env vars and reference them with
# `api_key_env`. Inline `api_key_value` exists for local dev only.
providers:
  - id: openai
    name: OpenAI
    type: openai
    api_key_env: MG_OPENAI_API_KEY
    description: OpenAI public API

  - id: anthropic
    name: Anthropic
    type: anthropic
    api_key_env: MG_ANTHROPIC_API_KEY

  - id: gemini
    name: Google Gemini
    type: gemini
    api_key_env: MG_GEMINI_API_KEY

  # Self-hosted (Ollama, vLLM, …). No API key needed; local network
  # endpoint goes on `api_endpoint`.
  - id: local-ollama
    name: Local Ollama
    type: selfhosted
    api_endpoint: http://localhost:11434

  # ── Image / video / audio providers (#105) ──────────────────────
  # Uncomment what you have keys for; everything else stays absent
  # and the loader will skip the matching models below.
  #
  # - id: xai
  #   name: xAI
  #   type: xai
  #   api_key_env: MG_XAI_API_KEY
  # - id: runway
  #   name: Runway
  #   type: runway
  #   api_key_env: MG_RUNWAY_API_KEY
  # - id: kling
  #   name: Kling (Kuaishou)
  #   type: kling
  #   api_key_env: MG_KLING_API_KEY
  # - id: lumaai
  #   name: Luma AI
  #   type: lumaai
  #   api_key_env: MG_LUMA_API_KEY
  # - id: pika
  #   name: Pika Labs
  #   type: pika
  #   api_key_env: MG_PIKA_API_KEY
  # - id: minimax
  #   name: MiniMax (Hailuo)
  #   type: minimax
  #   api_key_env: MG_MINIMAX_API_KEY
  # - id: bytedance
  #   name: ByteDance Seedance
  #   type: bytedance
  #   api_key_env: MG_BYTEDANCE_API_KEY
  # - id: elevenlabs
  #   name: ElevenLabs
  #   type: elevenlabs
  #   api_key_env: MG_ELEVENLABS_API_KEY
  # - id: hume
  #   name: Hume AI (Octave)
  #   type: hume
  #   api_key_env: MG_HUME_API_KEY

# Models — what gets called. `provider` references a `providers[].id`.
# Cost fields are optional; leave blank to fall back to the gateway's
# built-in pricing map.
models:
  - id: gpt-4o
    name: gpt-4o
    provider: openai
    modality: text
    cost_per_1k_input_tokens: 0.0025
    cost_per_1k_output_tokens: 0.01

  - id: gpt-4o-mini
    name: gpt-4o-mini
    provider: openai
    modality: text
    cost_per_1k_input_tokens: 0.00015
    cost_per_1k_output_tokens: 0.0006

  - id: claude-3-5-sonnet
    name: claude-3-5-sonnet-latest
    provider: anthropic
    modality: text
    cost_per_1k_input_tokens: 0.003
    cost_per_1k_output_tokens: 0.015

  - id: gemini-2-flash
    name: gemini-2.0-flash
    provider: gemini
    modality: text

  - id: dalle-3
    name: dall-e-3
    provider: openai
    modality: image

  - id: llama3-local
    name: llama3
    provider: local-ollama
    modality: text

  # ── Image / video / audio model entries (#105) ──────────────────
  # Each one needs its provider above (or in the DB) to be usable.
  #
  # - id: sora-2
  #   name: sora-2
  #   provider: openai
  #   modality: video
  # - id: veo-3
  #   name: veo-3.0-generate-001
  #   provider: gemini
  #   modality: video
  # - id: runway-gen3
  #   name: gen-3-alpha
  #   provider: runway
  #   modality: video
  # - id: kling-pro
  #   name: kling-1.6-pro
  #   provider: kling
  #   modality: video
  # - id: luma-dream
  #   name: dream-machine
  #   provider: lumaai
  #   modality: video
  # - id: pika-15
  #   name: pika-1.5
  #   provider: pika
  #   modality: video
  # - id: hailuo-01
  #   name: hailuo-01
  #   provider: minimax
  #   modality: video
  # - id: seedance-1
  #   name: seedance-1
  #   provider: bytedance
  #   modality: video
  # - id: tts-1
  #   name: tts-1
  #   provider: openai
  #   modality: audio
  # - id: eleven-v3
  #   name: eleven_v3
  #   provider: elevenlabs
  #   modality: audio
  # - id: hume-octave
  #   name: octave-tts
  #   provider: hume
  #   modality: audio
  # - id: whisper-1
  #   name: whisper-1
  #   provider: openai
  #   modality: audio

# Services — what callers send in `request.service`.
#
# `type: pool` distributes requests across `models` per `strategy`.
# `type: agentic` is accepted by the schema but the loader currently
#   only upserts the basic service row — full agentic config (planner,
#   tools, MCP wiring) lands in a follow-up.
# `type: multi_modality` is experimental — schema honours it, runtime
#   semantics are still settling.
services:
  # Cheapest-first chat with quality fallback.
  - name: cheap-chat
    type: pool
    strategy: least_cost
    description: Hits the cheapest available model first
    models:
      - id: gpt-4o-mini
        weight: 50
      - id: gemini-2-flash
        weight: 30
      - id: gpt-4o
        weight: 20

  # Premium chat with weighted A/B between providers.
  - name: premium-chat
    type: pool
    strategy: weighted_random
    models:
      - id: gpt-4o
        weight: 60
      - id: claude-3-5-sonnet
        weight: 40

  # Even split between local and remote via weighted_random with
  # equal weights. (`round_robin` will be available once the
  # `feat/unify-routing-strategies` PR lands.)
  - name: hybrid-chat
    type: pool
    strategy: weighted_random
    models:
      - id: llama3-local
        weight: 50
      - id: gpt-4o-mini
        weight: 50

  # Image generation. Single model → strategy is `none`.
  - name: image-gen
    type: pool
    strategy: none
    models:
      - id: dalle-3
        weight: 100

  # ── Video / audio service examples (#105) ───────────────────────
  # Uncomment after enabling the matching providers + models above.
  # `health` strategy = priority-order failover: try the first model,
  # fall over to the next on transient errors (rate_limit, 5xx,
  # circuit-breaker open). Costs decrease as you walk down the list.
  #
  # - name: video-default
  #   type: pool
  #   strategy: health
  #   description: Sora → Veo 3 → Runway → Kling failover
  #   models:
  #     - { id: sora-2,      weight: 100 }  # priority 1 (highest quality, slowest)
  #     - { id: veo-3,       weight: 100 }  # priority 2
  #     - { id: runway-gen3, weight: 100 }  # priority 3
  #     - { id: kling-pro,   weight: 100 }  # priority 4 (fastest fallback)
  #
  # - name: voice-default
  #   type: pool
  #   strategy: weighted_random
  #   description: Spread TTS load across cheap + premium voices
  #   models:
  #     - { id: tts-1,       weight: 50 }   # OpenAI — fast, cheap
  #     - { id: eleven-v3,   weight: 35 }   # ElevenLabs — best emotion
  #     - { id: hume-octave, weight: 15 }   # Hume — character voices
  #
  # - name: transcribe-default
  #   type: pool
  #   strategy: none
  #   models:
  #     - { id: whisper-1, weight: 100 }

  # Agentic example (declared, basic row upserted now,
  # planner/tool wiring lands in a follow-up PR).
  - name: research-agent
    type: agentic
    description: Reasoning agent with planner + tools
    agentic:
      planner_model: gpt-4o
      max_iterations: 8
      tools:
        - type: model
          target: gpt-4o-mini
          name: chat
          description: Quick chat for sub-tasks
        - type: service
          target: image-gen
          name: generate_image
          description: Generate an illustration

# MCP servers — phase-2: schema accepted, upsert deferred. Use
# /v1/mcp API for now.
mcp_servers: []
