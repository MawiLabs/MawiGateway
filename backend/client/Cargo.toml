[package]
name = "mawi-client"
version = "0.1.0"
edition = "2021"
description = "Typed HTTP client for the MawiGateway API. Shared between the mawi CLI and the mawi-mcp server so both stay in sync with the gateway's REST surface."

[lib]
path = "src/lib.rs"

[dependencies]
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
thiserror = "1.0"
tokio-stream = { workspace = true }
bytes = { workspace = true }
futures-util = "0.3"
urlencoding = "2.1"
