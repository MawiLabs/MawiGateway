[package]
name = "gateway"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "gateway"
path = "src/main.rs"

[lib]
name = "gateway"
path = "src/lib.rs"

[dependencies]
mawi-core = { path = "../core", features = ["openapi"] }

# External dependencies
poem = { workspace = true }
poem-openapi = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
tokio-stream = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
time = "0.3"
lazy_static = "1.5.0"
futures = "0.3"
async-stream = "0.3"
serde_yaml = "0.9"
rand = "0.8"
regex = "1"
bcrypt = "0.17.1"
dotenv = "0.15.0"
sha2 = "0.10"
hex = "0.4"
dashmap = "5.5"
moka = { version = "0.12", features = ["future"] }
prometheus = "0.13"
scopeguard = "1.2"
# Distributed rate limiting (#79). connection-manager handles
# reconnects so the gateway doesn't have to. tokio-comp picks the
# right reactor for the runtime we already use.
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

[features]
default = []

